# MySQL connection (edit for your machine)
db.url=jdbc:mysql://localhost:3306/medstore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=6456

# Folder where uploaded images are stored (medicine photos, prescriptions, etc.)
uploads.directory=C:/medstore-uploads

# Admin self-registration (optional). If empty/missing, admin signup is disabled.
# Set to a secret you know, e.g. security.admin_registration_key=LetMeIn-2026
security.admin_registration_key=6456

# Optional: absolute folder for uploaded images (defaults to ~/.medstore/uploads)
# uploads.directory=C:/medstore-uploads

